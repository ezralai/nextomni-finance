<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="pbbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D91E2A"/>
      <stop offset="100%" stop-color="#9E0C16"/>
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="120" height="120" rx="26" fill="url(#pbbBg)"/>
  <rect x="3" y="3" width="114" height="114" rx="23" fill="none" stroke="#FF6B72" stroke-width="1.5" opacity="0.3"/>

  <!-- Public Bank Stylized Geometric Emblem -->
  <g transform="translate(35, 20)">
    <polygon points="25,4 46,16 46,40 25,52 4,40 4,16" fill="#FFFFFF"/>
    <polygon points="25,12 38,20 38,36 25,44 12,36 12,20" fill="#A80E17"/>
    <!-- Interlocking center beam -->
    <rect x="22" y="16" width="6" height="24" fill="#FFFFFF"/>
    <rect x="14" y="25" width="22" height="6" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <text x="60" y="93" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="13.5" fill="#FFFFFF" letter-spacing="0.5">PUBLIC BANK</text>
</svg>
