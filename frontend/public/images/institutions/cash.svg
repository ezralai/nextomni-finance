<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="120" height="120" rx="26" fill="url(#cashBg)"/>
  <rect x="3" y="3" width="114" height="114" rx="23" fill="none" stroke="#34D399" stroke-width="1.5" opacity="0.4"/>

  <!-- Banknote Emblem -->
  <g transform="translate(24, 22)">
    <rect x="4" y="10" width="64" height="38" rx="5" fill="#10B981" stroke="#A7F3D0" stroke-width="2"/>
    <circle cx="36" cy="29" r="11" fill="#047857" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="36" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF">$</text>
    <circle cx="12" cy="18" r="2.5" fill="#A7F3D0"/>
    <circle cx="60" cy="18" r="2.5" fill="#A7F3D0"/>
    <circle cx="12" cy="40" r="2.5" fill="#A7F3D0"/>
    <circle cx="60" cy="40" r="2.5" fill="#A7F3D0"/>
  </g>

  <!-- Wordmark -->
  <text x="60" y="93" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="14.5" fill="#FFFFFF" letter-spacing="0.5">CASH WALLET</text>
</svg>
