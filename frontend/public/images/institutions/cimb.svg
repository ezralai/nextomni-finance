<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cimbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0111A"/>
      <stop offset="100%" stop-color="#B3050D"/>
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="120" height="120" rx="26" fill="url(#cimbBg)"/>
  <rect x="3" y="3" width="114" height="114" rx="23" fill="none" stroke="#FF4D55" stroke-width="1.5" opacity="0.4"/>

  <!-- CIMB Modern Octagon Emblem -->
