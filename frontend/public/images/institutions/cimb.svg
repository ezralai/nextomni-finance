    <!-- Red & White Segmented Octagon Shape -->
    <path d="M18 4 L42 4 L56 18 L56 42 L42 56 L18 56 L4 42 L4 18 Z" fill="#7A0007"/>
    <path d="M20 7 L40 7 L53 20 L53 40 L40 53 L20 53 L7 40 L7 20 Z" fill="#FFFFFF"/>
