  <!-- Wordmark -->
  <text x="60" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" letter-spacing="1">CIMB</text>
